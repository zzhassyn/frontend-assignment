<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380">
  <defs>
    <linearGradient id="bgTuring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fae8d2"/>
      <stop offset="100%" stop-color="#e2c8a2"/>
    </linearGradient>
  </defs>
  <rect width="320" height="380" rx="16" fill="url(#bgTuring)"/>
  <!-- Decorative mathematical/computational binary pattern in background -->
  <g opacity="0.12" fill="#38bdf8" font-family="monospace" font-size="12">
    <text x="20" y="40">01000001 01001100 01000001 01001110</text>
    <text x="20" y="65">01010100 01010101 01010010 01001001</text>
    <text x="20" y="90">01001110 01000111 00100000 00110001</text>
    <text x="20" y="115">ENIGMA • BOMBE • ACE • TURING MACHINE</text>
  </g>
  <!-- Coat & Suit -->
  <path d="M 40 380 C 40 300, 90 260, 160 260 C 230 260, 280 300, 280 380 Z" fill="#0f172a"/>
  <!-- White shirt collar -->
  <polygon points="160,295 130,260 190,260" fill="#f8fafc"/>
  <polygon points="152,260 160,330 168,260" fill="#991b1b"/> <!-- Tie -->
  <!-- Neck -->
  <rect x="142" y="235" width="36" height="35" fill="#d4b48c" rx="4"/>
  <!-- Head -->
  <ellipse cx="160" cy="190" rx="48" ry="58" fill="url(#skin)"/>
  <!-- Hair (parted side) -->
  <path d="M 112 180 C 110 135, 130 125, 160 125 C 195 125, 212 145, 208 180 C 198 165, 185 160, 160 160 C 135 160, 120 168, 112 180 Z" fill="#2d1e18"/>
  <!-- Eyebrows -->
  <path d="M 132 174 Q 145 170 152 174" stroke="#2d1e18" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 168 174 Q 175 170 188 174" stroke="#2d1e18" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="143" cy="184" rx="4" ry="3" fill="#1e293b"/>
  <ellipse cx="177" cy="184" rx="4" ry="3" fill="#1e293b"/>
  <!-- Nose -->
  <path d="M 160 182 L 157 202 L 164 203" stroke="#b89368" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Lips -->
  <path d="M 148 218 Q 160 223 172 218" stroke="#a06040" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Plaque badge -->
  <rect x="30" y="335" width="260" height="32" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="160" y="356" fill="#e0e7ff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ALAN TURING (1912 – 1954)</text>
</svg>
