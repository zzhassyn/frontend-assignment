<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <rect width="800" height="560" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- WIREFRAME HEADER -->
  <rect x="20" y="20" width="760" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="35" y="32" width="110" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="90" y="49" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">[LOGO: DevSphere]</text>
  
  <g font-family="sans-serif" font-size="11" fill="#64748b">
    <rect x="380" y="32" width="60" height="24" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="410" y="48" text-anchor="middle">Home</text>
    <rect x="450" y="32" width="65" height="24" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="482" y="48" text-anchor="middle">Projects</text>
    <rect x="525" y="32" width="70" height="24" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="560" y="48" text-anchor="middle">Community</text>
    <rect x="605" y="32" width="65" height="24" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <text x="637" y="48" text-anchor="middle" font-weight="bold">Contact</text>
    <rect x="680" y="30" width="85" height="28" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <text x="722" y="48" text-anchor="middle" font-weight="bold">+ Post Project</text>
  </g>

  <!-- TITLE -->
  <rect x="20" y="85" width="760" height="40" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="35" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155">Contact &amp; Support - DevSphere Platform</text>

  <!-- TWO COLUMNS: CONTACT FORM (LEFT 440px) + FAQ & INFO (RIGHT 300px) -->
  <!-- Form Container -->
  <rect x="20" y="140" width="440" height="325" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="168" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">Send us a message</text>
  
  <text x="40" y="195" font-family="sans-serif" font-size="10" fill="#64748b">Full Name *</text>
  <rect x="40" y="202" width="400" height="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="218" font-family="sans-serif" font-size="10" fill="#94a3b8">Enter your name</text>

  <text x="40" y="244" font-family="sans-serif" font-size="10" fill="#64748b">University Email *</text>
  <rect x="40" y="251" width="400" height="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="267" font-family="sans-serif" font-size="10" fill="#94a3b8">student@astanait.edu.kz</text>

  <text x="40" y="293" font-family="sans-serif" font-size="10" fill="#64748b">Inquiry Topic</text>
  <rect x="40" y="300" width="400" height="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="316" font-family="sans-serif" font-size="10" fill="#64748b">General Feedback / Bug Report ▼</text>

  <text x="40" y="342" font-family="sans-serif" font-size="10" fill="#64748b">Your Message *</text>
  <rect x="40" y="349" width="400" height="60" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="370" font-family="sans-serif" font-size="10" fill="#94a3b8">Describe your question or feedback...</text>

  <rect x="40" y="420" width="140" height="30" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="110" y="439" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Send Message</text>

  <!-- Right Column: Info & FAQ -->
  <rect x="480" y="140" width="300" height="325" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="168" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">Support &amp; Team Contacts</text>
  <text x="500" y="190" font-family="sans-serif" font-size="10" fill="#64748b">Location: Astana IT University, EXPO C1</text>
  <text x="500" y="206" font-family="sans-serif" font-size="10" fill="#64748b">Email: devsphere@astanait.edu.kz</text>
  <text x="500" y="222" font-family="sans-serif" font-size="10" fill="#64748b">Team: Zhassyn Z., Mardan K., Raiymbek M.</text>

  <line x1="495" y1="240" x2="765" y2="240" stroke="#e2e8f0"/>

  <text x="500" y="260" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">Frequently Asked Questions</text>
  
  <rect x="500" y="275" width="260" height="35" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="510" y="293" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155">Q: Can any student submit a project?</text>
  <text x="510" y="304" font-family="sans-serif" font-size="9" fill="#64748b">A: Yes, with an active student email.</text>

  <rect x="500" y="320" width="260" height="35" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="510" y="338" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155">Q: How do team invitations work?</text>
  <text x="510" y="349" font-family="sans-serif" font-size="9" fill="#64748b">A: Project owners get email alerts.</text>

  <rect x="500" y="365" width="260" height="35" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="510" y="383" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155">Q: Is the platform open-source?</text>
  <text x="510" y="394" font-family="sans-serif" font-size="9" fill="#64748b">A: Yes, hosted on our GitHub repo.</text>

  <!-- FOOTER -->
  <rect x="20" y="485" width="760" height="55" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="515" font-family="sans-serif" font-size="11" fill="#64748b">&copy; 2026 DevSphere. Group: Zhassyn Z., Mardan K., Raiymbek M.</text>
  <text x="620" y="515" font-family="sans-serif" font-size="11" fill="#64748b">Office Hours: Mon-Fri 10:00 - 18:00</text>
